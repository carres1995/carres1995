# Guárdalo en:  .github/workflows/snake.yml  (dentro del repo carres1995/carres1995)
name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # se regenera cada día a medianoche UTC
  workflow_dispatch:        # también permite ejecutarlo manualmente
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: carres1995
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}